

[mgr]
show_hidden = false
linemode = "mtime"
sort_by = "mtime"
sort_sensitive = false
sort_reverse = true
sort_dir_first = true

# DOSYA AÇICILARI
[opener]

edit = [
    { run = 'nvim %s', block = true, desc = "Neovim", for = "unix" }
]

ghostty = [
    { run = 'ghostty -e "$SHELL" -c "cd \"$1\"; exec $SHELL"', desc = "Open with Ghostty", block = false, for = "unix" }
]

# DOSYA AÇMA KURALLARI
[open]
prepend_rules = [
    { mime = "text/*", use = "edit" },
    { mime = "application/json", use = "edit" },
    { mime = "inode/empty", use = "edit" },
    { url = "*.toml", use = "edit" },
    { url = "*.yaml", use = "edit" },
    { url = "*.yml", use = "edit" },
    { url = "*.md", use = "edit" },
    { url = "*.py", use = "edit" },
    { url = "*.sh", use = "edit" },
    { url = "*.lua", use = "edit" }
]
