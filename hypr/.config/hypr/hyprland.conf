# /* ---- 💫 Hyprland Konfigürasyonu - Sade & Güçlü 💫 ---- */ 

# --- 1. DEĞİŞKENLER VE YOLLAR ---
$settings = $HOME/.config/hypr/settings
$UserConfigs = $HOME/.config/hypr/UserConfigs

# --- 2. MONİTÖR OTOMASYONU ---
# Cihaz adına göre doğru monitör ayarını yükler
exec-once = ln -sf $HOME/.config/hypr/monitors_$(hostname).conf $HOME/.config/hypr/monitors_active.conf
source = ~/.config/hypr/monitors_active.conf

# --- 3. ANA SİSTEM AYARLARI ---
source = $settings/ENVariables.conf    # Sistem ortam değişkenleri
source = $UserConfigs/ENVariables.conf  # Kullanıcı ortam değişkenleri

source = $settings/Startup_Apps.conf   # Sistem başlangıç uygulamaları
source = $UserConfigs/Startup_Apps.conf # Senin başlangıç uygulamaların

# --- 4. KLAVYE, PENCERE VE AYARLAR ---
source = $settings/WindowRules.conf    # Genel pencere kuralları
source = $UserConfigs/WindowRules.conf  # Senin özel pencere kuralların

source = $settings/Keybinds.conf       # Temel sistem kısayolları
source = $UserConfigs/UserKeybinds.conf # SENİN kısayolların (Super 1, 2 vb.)

# --- 5. GÖRSEL VE GİRDİ AYARLARI (DOĞRUDAN BURADA) ---
input {
    kb_layout = tr
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
    sensitivity = 0
}

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(ff0000ff)   # Aktif: Kırmızı
    col.inactive_border = rgba(0000ffff) # Pasif: Mavi
    layout = dwindle
}

decoration {
    rounding = 10
    active_opacity = 1.0
    inactive_opacity = 0.9
    blur {
        enabled = false
    }
}

animations {
    enabled = true
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 5, myBezier
    animation = workspaces, 1, 5, default
}

# --- 6. SERVİSLER ---
exec-once = wl-paste --type text --watch cliphist store 
exec-once = wl-paste --type image --watch cliphist store

# Opsiyonel: Eğer bu dosyalar varsa açabilirsin
source = $UserConfigs/UserAnimations.conf
source = $UserConfigs/UserDecorations.conf
source = $UserConfigs/UserSettings.conf
