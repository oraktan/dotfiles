# ASUS monitörü port adı (DP-6) yerine açıklamasıyla tanımlayın
monitor=desc:Ancor Communications Inc ASUS VS228 E7LMTF193542, 1920x1080@60, 1920x0, 1



workspace = 1, monitor:0, default:true

# Workspace 2'yi HDMI ekranına (ID 1) zorla
workspace = 2, monitor:1, default:true


# Ghostty için (Class ismini tam eşleyelim)
windowrulev2 = workspace 6, class:^(com.mitchellh.ghostty)$

# Ghostty terminalini her zaman 6. workspace'e gönder

# Ana ekran (Laptop paneli)
monitor=eDP-1, 1920x1080@60, 0x0, 1

# İkinci ekran (ASUS) - Ana ekranın sağına yerleştiriyoruz
monitor=DP-5, 1920x1080@60, 1920x0, 1


general {
    border_size = 3                # border kalınlığı
    col.active_border = rgba(ff0000ff)   # odaklanan pencere kırmızı
    col.inactive_border = rgba(0000ffff) # odak dışı pencere mavi
}

exec-once = wl-paste --type text --watch cliphist store # Yazıları kaydeder
exec-once = wl-paste --type image --watch cliphist store # Görselleri kaydeder
