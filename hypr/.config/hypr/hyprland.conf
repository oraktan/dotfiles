# /* ---- 💫 hyprland.conf - Sade & Güçlü 💫 ---- */

# ────────────────────────────────────────────
# DEĞİŞKENLER
# ────────────────────────────────────────────
$scripts     = $HOME/.config/hypr/scripts
$UserConfigs = $HOME/.config/hypr/UserConfigs

# ────────────────────────────────────────────
# MONİTÖR
# ────────────────────────────────────────────
# exec-once = ln -sf $HOME/.config/hypr/monitors_$(hostname).conf $HOME/.config/hypr/monitors_active.conf
#source = ~/.config/hypr/monitors_fedora.conf

#source = ~/.config/hypr/monitors_desktop.conf

source = ~/.config/hypr/monitors_laptop.conf
# ────────────────────────────────────────────
# ORTAM DEĞİŞKENLERİ
# ────────────────────────────────────────────
source = $UserConfigs/ENVariables.conf

# ────────────────────────────────────────────
# BAŞLANGIÇ UYGULAMALARI
# ────────────────────────────────────────────
source = $UserConfigs/Startup_Apps.conf

exec-once = wl-paste --type text  --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# ────────────────────────────────────────────
# PENCERE KURALLARI
# ────────────────────────────────────────────
#source = $UserConfigs/WindowRules.conf

source = $UserConfigs/WindowRulesNew.conf

# ────────────────────────────────────────────
# KİŞİSEL AYARLAR (dekorasyon, animasyon vb.)
# ────────────────────────────────────────────
source = $UserConfigs/UserDecorations.conf
source = $UserConfigs/UserAnimations.conf
source = $UserConfigs/UserSettings.conf

# ────────────────────────────────────────────
# KISA YOLLAR — tek dosyada toplandı
# ────────────────────────────────────────────
source = $HOME/.config/hypr/Keybinds.conf

# ────────────────────────────────────────────
# GİRDİ
# ────────────────────────────────────────────
input {
    kb_layout  = tr
    follow_mouse = 1
    sensitivity  = 0
    touchpad {
        natural_scroll = true
    }
}

# ────────────────────────────────────────────
# GENEL GÖRÜNÜM
# ────────────────────────────────────────────
general {
    gaps_in  = 4
    gaps_out = 8
    border_size = 2
    col.active_border   = rgba(ff0000ff)
    col.inactive_border = rgba(0000ffff)
    layout = dwindle
}

decoration {
    rounding         = 10
    active_opacity   = 1.0
    inactive_opacity = 0.9
    blur {
        enabled = false
    }
}

animations {
    enabled = true
    bezier    = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows,    1, 5, myBezier
    animation = workspaces, 1, 5, default
}
exec-once = rclone mount gdrive: ~/GoogleDrive --vfs-cache-mode off --vfs-read-chunk-size 1M --vfs-read-chunk-size-limit 10M &
exec-once = rclone mount DriveINFO: ~/DriveINFO --vfs-cache-mode full --vfs-read-chunk-size 1M --vfs-read-chunk-size-limit 10M --daemon &
exec-once = nm-applet --indicator &
# NumLock KAPALIYKEN Sadece Tuşla Geçiş (1-9)
