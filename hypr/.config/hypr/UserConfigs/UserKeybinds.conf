# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */  #
# This is where you put your own keybinds. Be Mindful to check as well ~/.config/hypr/configs/Keybinds.conf to avoid conflict
# if you think I should replace the Pre-defined Keybinds in ~/.config/hypr/configs/Keybinds.conf , submit an issue or let me know in DC and present me a valid reason as to why, such as conflicting with global shortcuts, etc etc

# See https://wiki.hyprland.org/Configuring/Keywords/ for more settings and variables
# See also Laptops.conf for laptops keybinds 

# /* ---- ✴️ Variables ✴️ ---- */  #
$mainMod = SUPER
$scriptsDir = $HOME/.config/hypr/scripts
$UserScripts = $HOME/.config/hypr/UserScripts
$UserConfigs = $HOME/.config/hypr/UserConfigs

# settings for User defaults apps - set your default terminal and file manager on this file
source= $UserConfigs/01-UserDefaults.conf

# common shortcuts
#bindr = $mainMod, $mainMod_L, exec, pkill rofi || rofi -show drun -modi drun,filebrowser,run,window # Super Key to Launch rofi menu
bind = $mainMod, space, exec, pkill rofi || true && rofi -show drun -modi drun,filebrowser,run,window # Main Menu (APP Launcher)
#bind = $mainMod, D, exec, pkill rofi || true && rofi -show drun -modi drun,filebrowser,run,window # Main Menu (APP Launcher)
bind = $mainMod, F, exec, pkill rofi || true && rofi -show filebrowser -modi drun,filebrowser,run,window # Main Menu (APP Launcher)
bind = $mainMod, W, exec, pkill rofi || true && rofi -show window -modi drun,filebrowser,run,window # Main Menu (APP Launcher)
#bind = $mainMod, A, exec, pkill rofi || true && ags -t 'overview' # desktop overview (if installed)
#bind = $mainMod, A, global, quickshell:overviewToggle # desktop overview (if installed)


bind = $mainMod, C, killactive, 


# FEATURES / EXTRAS
#bind = $mainMod ALT,  H, exec, $scriptsDir/KeyHints.sh # help / cheat sheet
bind = $mainMod ALT, R, exec, $scriptsDir/Refresh.sh # Refresh waybar, swaync, rofi
bind = $mainMod ALT, E, exec, $scriptsDir/RofiEmoji.sh # emoji menu
#bind = ,code:67, exec, $scriptsDir/RofiSearch.sh # Google search using rofi
bind = $mainMod ALT, O, exec, $scriptsDir/ChangeBlur.sh # Toggle blur settings 
bind = $mainMod SHIFT, G, exec, $scriptsDir/GameMode.sh # Toggle animations ON/OFF
bind = $mainMod ALT, L, exec, $scriptsDir/ChangeLayout.sh # Toggle Master or Dwindle Layout
#bind = $mainMod ALT, V, exec, $scriptsDir/ClipManager.sh # Clipboard Manager
bind = $mainMod CTRL, R, exec, $scriptsDir/RofiThemeSelector.sh # KooL Rofi Menu Theme Selector
bind = $mainMod CTRL SHIFT, R, exec, pkill rofi || true && $scriptsDir/RofiThemeSelector-modified.sh # modified Rofi Theme Selector

#bind = $mainMod, S, fullscreen, 1 # fake full screen
#bind = $mainMod, SPACE, togglefloating, #Float Mode
bind = $mainMod ALT, SPACE, exec, hyprctl dispatch workspaceopt allfloat #All Float Mode
bind = $mainMod SHIFT, Return, exec, $scriptsDir/Dropterminal.sh $term # Dropdown terminal
bind = ,code:96, exec, $scriptsDir/Dropterminal.sh $term # Dropdown terminal

# Desktop zooming or magnifier
bind = $mainMod ALT, mouse_down, exec, hyprctl keyword cursor:zoom_factor "$(hyprctl getoption cursor:zoom_factor | awk 'NR==1 {factor = $2; if (factor < 1) {factor = 1}; print factor * 2.0}')"
bind = $mainMod ALT, mouse_up, exec, hyprctl keyword cursor:zoom_factor "$(hyprctl getoption cursor:zoom_factor | awk 'NR==1 {factor = $2; if (factor < 1) {factor = 1}; print factor / 2.0}')" 

## NOTES for ja (Hyprland version 0.39 (Ubuntu 24.04))
#bind = $mainMod ALT, mouse_down, exec, hyprctl keyword misc:cursor_zoom_factor "$(hyprctl getoption misc:cursor_zoom_factor | awk 'NR==1 {factor = $2; if (factor < 1) {factor = 1}; print factor * 2.0}')"
#bind = $mainMod ALT, mouse_up, exec, hyprctl keyword misc:cursor_zoom_factor "$(hyprctl getoption misc:cursor_zoom_factor | awk 'NR==1 {factor = $2; if (factor < 1) {factor = 1}; print factor / 2.0}')" 

# Waybar / Bar related
bind = $mainMod CTRL ALT, B, exec, pkill -SIGUSR1 waybar # Toggle hide/show waybar 
bind = $mainMod CTRL, B, exec, $scriptsDir/WaybarStyles.sh # Waybar Styles Menu
bind = $mainMod ALT, B, exec, $scriptsDir/WaybarLayout.sh # Waybar Layout Menu

# FEATURES / EXTRAS (UserScripts)
bind = $mainMod, M, exec, $UserScripts/RofiBeats.sh # online music using rofi
bind = $mainMod SHIFT, W, exec, $UserScripts/WallpaperEffects.sh # Wallpaper Effects by imagemagick
bind = CTRL ALT, W, exec, $UserScripts/WallpaperRandom.sh # Random wallpapers
bind = $mainMod CTRL, O, exec, hyprctl setprop active opaque toggle # disable opacity on active window
bind = $mainMod, H, exec, $scriptsDir/KeyBinds.sh # search keybinds via rofi
bind = $mainMod SHIFT, A, exec, $scriptsDir/Animations.sh #hyprland animations menu
bind = $mainMod SHIFT, O, exec, $UserScripts/ZshChangeTheme.sh # Change oh-my-zsh theme
bindln = ALT_L, SHIFT_L, exec, $scriptsDir/SwitchKeyboardLayout.sh # Change keyboard layout globally
bindln = SHIFT_L, ALT_L, exec, $scriptsDir/Tak0-Per-Window-Switch.sh # Change keyboard layout locally for each window
# $mainMod + D ile Ghostty içinde Downloads klasöründe Yazi'yi açar
bind = $mainMod, D, exec, ghostty --working-directory=~/Downloads -e yazi


#bind = CTRL, h, movefocus, l 
bind = CTRL, j, movefocus, d
bind = CTRL, k, movefocus, u 
#bind = CTRL, l, movefocus, r 


# --- 💫 Standart Kısayollar (Tamir Edildi) 💫 ---


# Workspace Değiştirme (SUPER + 1-0)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Pencereyi Workspace'e Taşıma (SUPER + SHIFT + 1-0)
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 10
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Workspace Geçişleri (Tab ve Mouse Scroll)
bind = $mainMod, tab, workspace, m+1
bind = $mainMod SHIFT, tab, workspace, m-1
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Özel Workspace (Scratchpad)
bind = $mainMod, U, togglespecialworkspace,
bind = $mainMod SHIFT, U, movetoworkspace, special

# Yön Tuşları ile Workspace Geçişi (CTRL + ALT + Sağ/Sol)
bind = CTRL_ALT, right, workspace, e+1
bind = CTRL_ALT, left, workspace, e-1

# Tüm pencereleri Float (yüzer) yapma
bind = $mainMod ALT, SPACE, exec, hyprctl dispatch workspaceopt allfloat


#bind = CTRL_ALT, T, exec, ghostty 



#bind = SUPER, E, exec, xfe-xfe 



 # bind=,code:70,exec,kitty -e btop     #  örneği
bind=,code:78,exec,kitty -e btop    # Scroll örneği 
#bind=,code:118, exec, gnome-text-editor# insert
bind =,code:127, workspace, 3 # NOTE: code:12 = key 3
#bind=,code:127,exec,gnome-text-editor# PAUSE
#bind=,127,exec,sh -c 'hyprctl dispatch workspace 1 && sleep 0.2 && ydotool key 29:1 2:1 2:0 29:0'


#######################################################
# Sonradan eklediklerim buradan sonra geçerli olacaktır 
#######################################################

bind = $mainMod, V, exec, copyq toggle 


# Bir sağdaki workspace'e git
bind = CTRL_ALT, right, workspace, e+1

# Bir soldaki workspace'e git (istersen ekle)
bind = CTRL_ALT, left, workspace, e-1

bind = $mainMod,l, exec, hyprlock

#waterfox profilleri
#bind = CTRL ALT, 3, exec, waterfox -p Whatsapp 
#bind = CTRL ALT, 1, exec, waterfox -p Taner 
#bind = CTRL ALT, 2, exec, waterfox -p work 
#bind = CTRL ALT, 4, exec, waterfox -p info 
#bind = CTRL ALT, 5, exec, thunderbird 
#

# pencereler arası taşıma
bind = SUPER, F1, movetoworkspace, 1
bind = SUPER, F2, movetoworkspace, 2
bind = SUPER, F3, movetoworkspace, 3
bind = SUPER, F4, movetoworkspace, 4
bind = SUPER, F5, movetoworkspace, 5
bind = SUPER, F6, movetoworkspace, 6
bind = SUPER, F7, movetoworkspace, 7
bind = SUPER, F8, movetoworkspace, 8
bind = SUPER, F9, movetoworkspace, 9
bind = SUPER, F10, movetoworkspace, 10


#suspend etme
bind = ALT, F4, exec, systemctl suspend

#copy q 
bind = $mainMod, V, exec, copyq toggle

#ekran büyütme screenshott
bind = SUPER, S, fullscreen, 1 
 
bind= , Print, exec, $scriptsDir/ScreenShot.sh --area

bindd = $mainMod ALT, W, select wallpaper, exec, $UserScripts/WallpaperSelect.sh

# ~/.config/hypr/hyprland.conf
bind = SUPER, B, exec, ~/.config/rofi/bluetooth-menu.sh

# [workspace X] komutu, uygulama ne olursa olsun onu belirtilen alana açmaya zorlar.
bind = CTRL ALT, 1, exec, [workspace 1] waterfox -p Taner
bind = CTRL ALT, 2, exec, [workspace 2] waterfox -p work
bind = CTRL ALT, 3, exec, [workspace 3] waterfox -p Whatsapp
bind = CTRL ALT, 4, exec, [workspace 4] waterfox -p info

# Sesi açmak için: Ctrl + Alt + Mouse Wheel Up (Yukarı)
bind = CTRL ALT, mouse_up, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 10%-

# Sesi kısmak için: Ctrl + Alt + Mouse Wheel Down (Aşağı)
bind = CTRL ALT, mouse_down, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 10%+
bind = $mainMod, O, exec, sh -c "~/dotfiles/scripts/scripts/ocr.sh"
#bind = $mainMod, I, exec, ~/.config/rofi/rofi-network-manager/src/ronema
#bind = $mainMod, I, exec, bash /usr/local/bin/networkmanager_dmenu
# ~/.config/hypr/hyprland.conf
bind = $mainMod, I, exec, pkill rofi || /usr/local/bin/networkmanager_dmenu
# Geçmişi aç ve seçileni yapıştır
#bind = $mainMod, V, exec, cliphist list | rofi -dmenu | cliphist decode | wl-copy
#bind = SUPER, V, exec, cliphist list | rofi -dmenu | cliphist decode | wl-copy && wtype -M ctrl v -m ctrl
#bind = SUPER, V, exec, cliphist list | rofi -dmenu -i -p "Pano" | cliphist decode | wl-copy && wtype -M ctrl v -m ctrl
bind = SUPER, V, exec, (echo "󰆴 TÜM GEÇMİŞİ SİL"; cliphist list) | rofi -dmenu -i -p "Pano" -selected-row 1 | if read -r selected; then if [ "$selected" = "󰆴 TÜM GEÇMİŞİ SİL" ]; then cliphist wipe && notify-send "Pano" "Tüm geçmiş temizlendi!"; else echo "$selected" | cliphist decode | wl-copy && sleep 0.1 && wtype -M ctrl v -m ctrl; fi; fi
bind = $mainMod, Insert, exec, rofi -dmenu -p "📝 Not Al" | xargs -I{} sh -c 'if [ -n "{}" ]; then echo -e "$(date "+%d.%m.%Y %H:%M") -> {}\n$(cat ~/notlar.txt 2>/dev/null)" > ~/notlar.txt && notify-send "Not Kaydedildi" "{}"; fi'
# Notları Rofi içinde sadece görüntülemek için:
bind = $mainMod SHIFT, Insert, exec, rofi -dmenu -p "📚 Notların" < ~/notlar.txt
bind = , Insert, exec, mousepad ~/notlar.txt
# F1 tuşu ile son workspace'e hızlı geçiş
bind = , F1, workspace, previous
