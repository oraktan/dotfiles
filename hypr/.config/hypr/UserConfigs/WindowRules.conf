## 1. Taner (Çıktıda 'Personal' geçiyor)


# Workspace 1: Taner (Personal)
windowrulev2 = workspace 1, class:^(waterfox)$, title:(.*Personal.*)

# Workspace 2: Work (Original Profile)
# NOT: Çıktıda Original Profile pencereleri 5'te görünüyor, kuralı 2'ye zorluyoruz.
windowrulev2 = workspace 2, class:^(waterfox)$, title:(.*Original profile.*)

# Workspace 3: WhatsApp
windowrulev2 = workspace 3, class:^(waterfox)$, title:(.*WhatsApp.*)

# Workspace 5: Thunderbird (Tam Sınıf İsmiyle)
windowrulev2 = workspace 5, class:^(net.thunderbird.Thunderbird)$

# Workspace 5: Info (Sadece TÜRKINFORM içeren pencereler için)
windowrulev2 = workspace 5, class:^(waterfox)$, title:(.*TÜRKINFORM.*)

# Workspace 6: Ghostty
windowrulev2 = workspace 6, class:^(com.mitchellh.ghostty)$ 6, class:^(com.mitchellh.ghostty)$aterfox)$, title:^(WhatsApp — Waterfox)$
windowrulev2 = workspace 7, class:^(org.kde.okular)$


#gnome loupe ile saydam dosyalar
# Fotoğraf görüntüleyiciyi tamamen mat (opak) yap
windowrulev2 = opaque, class:^(org.gnome.Loupe)$

# Alternatif olarak hem aktifken hem de arkadayken %100 görünür yap
windowrulev2 = opacity 1.0 override 1.0 override, class:^(org.gnome.Loupe)$



windowrulev2 = float, class:^(org.gnome.Loupe)$
windowrulev2 = size 60% 60%, class:^(org.gnome.Loupe)$
windowrulev2 = center, class:^(org.gnome.Loupe)$
# Mousepad için modern pencere kuralları (v2)
windowrulev2 = float, class:^(mousepad)$
windowrulev2 = center, class:^(mousepad)$
windowrulev2 = size 800 500, class:^(mousepad)$
windowrulev2 = opacity 0.95 0.85, class:^(mousepad)$ # Odaklanınca %95, arkadayken %85 şeffaflık
windowrulev2 = pin, class:^(mousepad)$ # İstersen diğer workspacelerde de gözükmesi için sabitleyebilirsin
