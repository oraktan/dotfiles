# Window Rules - Modern v2 Syntax (Hyprland 0.50+)

# --- Workspace Assignments ---

# Workspace 1: Taner (Personal)
windowrulev2 = workspace 1, class:^(waterfox)$, title:.*Personal.*

# Workspace 2: Work
windowrulev2 = workspace 2, class:^(waterfox)$, title:.*Original profile.*

# Workspace 3: WhatsApp
windowrulev2 = workspace 3, class:^(waterfox)$, title:.*WhatsApp.*

# Workspace 5: Thunderbird & TÜRKINFORM
windowrulev2 = workspace 5, class:^(net.thunderbird.Thunderbird)$
# windowrulev2 = workspace 5, class:^(waterfox)$, title:.*TÜRKINFORM.*

# Workspace 6: Ghostty
windowrulev2 = workspace 6, class:^(com.mitchellh.ghostty)$

# Workspace 7: Okular
windowrulev2 = workspace 7, class:^(org.kde.okular)$

# --- GNOME Loupe (Resim Görüntüleyici) ---
windowrulev2 = opacity 1.0 override 1.0 override, class:^(org.gnome.Loupe)$
windowrulev2 = float, class:^(org.gnome.Loupe)$
windowrulev2 = size 60% 60%, class:^(org.gnome.Loupe)$
windowrulev2 = center, class:^(org.gnome.Loupe)$

# --- Mousepad (Metin Düzenleyici) ---
windowrulev2 = float, class:^(mousepad)$
windowrulev2 = center, class:^(mousepad)$
windowrulev2 = size 800 500, class:^(mousepad)$
windowrulev2 = opacity 0.95 override 0.85 override, class:^(mousepad)$
windowrulev2 = pin, class:^(mousepad)$
