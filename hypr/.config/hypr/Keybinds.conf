# /* ---- 💫 Keybinds 💫 ---- */

$mainMod  = SUPER
$scripts  = $HOME/.config/hypr/scripts
$UserConfigs = $HOME/.config/hypr/UserConfigs

source = $UserConfigs/01-UserDefaults.conf   # $term, $files vb. buradan gelir

# ────────────────────────────────────────────
# TEMEL UYGULAMALAR
# ────────────────────────────────────────────
bindd = $mainMod, Return,      open terminal,        exec, $term
bindd = $mainMod, E,           file manager,         exec, gtk-launch doublecmd
bindd = $mainMod, D,           downloads + yazi,     exec, ghostty --working-directory=~/Downloads -e yazi
bindd = $mainMod, B,           bluetooth menu,       exec, ~/.config/rofi/bluetooth-menu.sh
# Rofi Wi-Fi Menüsü (Kendi scriptin)
bind = $mainMod, I, exec, sh -c 'pkill rofi || /home/thinkpad/dotfiles/scripts/scripts/rofi-wifi-menu/rofi-wifi-menu.sh'
bind  = CTRL ALT, T,           exec, ghostty

# ────────────────────────────────────────────
# UYGULAMA BAŞLATICI / ROFI
# ────────────────────────────────────────────
bindd = $mainMod, Space,       app launcher,         exec, pkill rofi || true && rofi -show drun -modi drun,filebrowser,run,window
# bindd = $mainMod, F,           file browser,         exec, pkill rofi || true && rofi -show filebrowser -modi drun,filebrowser,run,window
# bindd = $mainMod, F, file browser, exec, pkill rofi || rofi -show filebrowser -matching fuzzy -modi filebrowser
# bindd = $mainMod, F, file browser, exec, find $HOME -maxdepth 3 -not -path '*/.*' | sed "s|$HOME/||" | rofi -dmenu -i -p "󰉋 Dosya Ara" | xargs -I {} xdg-open "$HOME/{}"
# bindd = $mainMod, W,           window switcher,      exec, pkill rofi || true && rofi -show window -modi drun,filebrowser,run,window
# Eski satırı bununla değiştir:
bind = $mainMod, F, exec, ~/.config/hypr/scripts/rofi-search.sh
# bindd = $mainMod, W, window switcher, exec, bash -c "pkill rofi; rofi -show window -modi drun,filebrowser,run,window"
# bindd = $mainMod, W, window switcher, exec, sh -c "pkill rofi; rofi -show window"
# bindd= $mainMod, W, window switcher, exec, bash -c "pkill rofi; rofi -show window -matching fuzzy -sorting-method fzf"
# bind = $mainMod, W, exec, bash -c "pkill rofi; rofi -show window"
bindd = $mainMod, A,           desktop overview,     exec, $scripts/OverviewToggle.sh
bind = $mainMod, W, exec, ~/.config/hypr/scripts/window-switcher.sh
# ────────────────────────────────────────────
# SİSTEM / OTURUM
# ────────────────────────────────────────────
bindd = $mainMod, Q,           close window,         killactive
bindd = $mainMod SHIFT, Q,     kill process,         exec, $scripts/KillActiveProcess.sh
bindd = $mainMod, L,           lock screen,          exec, hyprlock
bindd = CTRL ALT, L,           lock screen,          exec, $scripts/LockScreen.sh
bindd = CTRL ALT, Delete,      exit hyprland,        exec, hyprctl dispatch exit 0
bindd = CTRL ALT, P,           power menu,           exec, $scripts/Wlogout.sh
bindd = ALT, F4,               suspend,              exec, systemctl suspend
bindd = $mainMod SHIFT, N,     notifications,        exec, swaync-client -t -sw
bindd = $mainMod SHIFT, E,     quick settings,       exec, $scripts/Kool_Quick_Settings.sh

# ────────────────────────────────────────────
# PENCERE YÖNETİMİ
# ────────────────────────────────────────────
bindd = $mainMod, G,           toggle group,         togglegroup
bindd = $mainMod, Tab,         group forward,        changegroupactive, f
bindd = $mainMod SHIFT, Tab,   group back,           changegroupactive, b
bindd = $mainMod CTRL, Tab,    change group active,  changegroupactive
bindd = $mainMod CTRL, K,      move into group L,    moveintogroup, l
bindd = $mainMod CTRL, L,      move into group R,    moveintogroup, r
bindd = $mainMod CTRL, H,      move out of group,    moveoutofgroup
bindd = $mainMod ALT, SPACE,   all float,            exec, hyprctl dispatch workspaceopt allfloat
bindd = $mainMod CTRL, Return, swap with master,     layoutmsg, swapwithmaster
bindd = $mainMod CTRL, D,      remove master,        layoutmsg, removemaster
bindd = $mainMod, I,           add master,           layoutmsg, addmaster
bindd = $mainMod SHIFT, I,     toggle split,         togglesplit
bindd = $mainMod, P,           pseudo,               pseudo
bindd = $mainMod, M,           split ratio 0.3,      exec, hyprctl dispatch splitratio 0.3
bindd = SUPER, S,              maximize,             fullscreen, 1
bindd = $mainMod CTRL, O,      toggle opacity,       exec, hyprctl setprop active opaque toggle

# Odak taşıma
bind  = $mainMod, right,       movefocus, r
bind  = $mainMod, up,          movefocus, u
bind  = $mainMod, down,        movefocus, d
bind  = CTRL, j,               movefocus, d
bind  = CTRL, k,               movefocus, u

# Pencere taşıma
bindd = $mainMod CTRL, left,   move window L,        movewindow, l
bindd = $mainMod CTRL, right,  move window R,        movewindow, r
bindd = $mainMod CTRL, up,     move window U,        movewindow, u
bindd = $mainMod CTRL, down,   move window D,        movewindow, d

# Pencere swap
bindd = $mainMod ALT, left,    swap L,               swapwindow, l
bindd = $mainMod ALT, right,   swap R,               swapwindow, r
bindd = $mainMod ALT, up,      swap U,               swapwindow, u
bindd = $mainMod ALT, down,    swap D,               swapwindow, d

# Pencere boyutlandırma
binded = $mainMod SHIFT, left,  resize -50x0,        resizeactive, -50 0
binded = $mainMod SHIFT, right, resize +50x0,        resizeactive, 50 0
binded = $mainMod SHIFT, up,    resize 0x-50,        resizeactive, 0 -50
binded = $mainMod SHIFT, down,  resize 0x+50,        resizeactive, 0 50

# Mouse ile taşı/boyutlandır
bindmd = $mainMod, mouse:272,  move window,          movewindow
bindmd = $mainMod, mouse:273,  resize window,        resizewindow

# ────────────────────────────────────────────
# ÇALIŞMA ALANLARI (WORKSPACES)
# ────────────────────────────────────────────
# Geçiş
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Pencereyi taşı (takip et)
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Pencereyi taşı (sessiz)
bind = $mainMod CTRL, 1, movetoworkspacesilent, 1
bind = $mainMod CTRL, 2, movetoworkspacesilent, 2
bind = $mainMod CTRL, 3, movetoworkspacesilent, 3
bind = $mainMod CTRL, 4, movetoworkspacesilent, 4
bind = $mainMod CTRL, 5, movetoworkspacesilent, 5
bind = $mainMod CTRL, 6, movetoworkspacesilent, 6
bind = $mainMod CTRL, 7, movetoworkspacesilent, 7
bind = $mainMod CTRL, 8, movetoworkspacesilent, 8
bind = $mainMod CTRL, 9, movetoworkspacesilent, 9
bind = $mainMod CTRL, 0, movetoworkspacesilent, 10

# F tuşları ile taşıma
bind = SUPER, F1,  movetoworkspace, 1
bind = SUPER, F2,  movetoworkspace, 2
bind = SUPER, F3,  movetoworkspace, 3
bind = SUPER, F4,  movetoworkspace, 4
bind = SUPER, F5,  movetoworkspace, 5
bind = SUPER, F6,  movetoworkspace, 6
bind = SUPER, F7,  movetoworkspace, 7
bind = SUPER, F8,  movetoworkspace, 8
bind = SUPER, F9,  movetoworkspace, 9
bind = SUPER, F10, movetoworkspace, 10

# Sonraki/önceki workspace
bind = $mainMod, tab,         workspace, m+1
bind = $mainMod SHIFT, tab,   workspace, m-1
bind = CTRL ALT, right,       workspace, e+1
bind = CTRL ALT, left,        workspace, e-1
bind = $mainMod, mouse_down,  workspace, e+1
bind = $mainMod, mouse_up,    workspace, e-1
bind = $mainMod, comma,       workspace, e-1
bind = $mainMod SHIFT, bracketleft,  movetoworkspace, -1
bind = $mainMod SHIFT, bracketright, movetoworkspace, +1
bind = $mainMod CTRL, bracketleft,   movetoworkspacesilent, -1
bind = $mainMod CTRL, bracketright,  movetoworkspacesilent, +1
bind = , F1, workspace, previous

# Özel workspace (scratchpad)
bind = $mainMod, U,       togglespecialworkspace
bind = $mainMod SHIFT, U, movetoworkspace, special

# Monitörler arası workspace
bindd = $mainMod CTRL, F9,  move WS to left monitor,  movecurrentworkspacetomonitor, l
bindd = $mainMod CTRL, F10, move WS to right monitor, movecurrentworkspacetomonitor, r
bindd = $mainMod CTRL, F11, move WS to up monitor,    movecurrentworkspacetomonitor, u
bindd = $mainMod CTRL, F12, move WS to down monitor,  movecurrentworkspacetomonitor, d

# Waterfox profilleri
bind = CTRL ALT, 1, exec, [workspace 1] waterfox -p Taner
bind = CTRL ALT, 2, exec, [workspace 2] waterfox -p work
bind = CTRL ALT, 3, exec, [workspace 3] waterfox -p Whatsapp
bind = CTRL ALT, 4, exec, [workspace 4] waterfox -p info

# ────────────────────────────────────────────
# EKRAN GÖRÜNTÜSÜ & KAYIT
# ────────────────────────────────────────────
# bind  = , Print,                           exec, $scripts/ScreenShot.sh --area
# bind = , Print, exec, $scripts/ScreenShot2.sh --area
bind = , Print, exec, $scripts/ScreenShot2.sh --swappy
bindd = $mainMod, Print,                   screenshot area,    exec, $scripts/ScreenShot.sh --area
bindd = $mainMod CTRL, Print,              screenshot in 5s,   exec, $scripts/ScreenShot.sh --in5
bindd = $mainMod CTRL SHIFT, Print,        screenshot in 10s,  exec, $scripts/ScreenShot.sh --in10
bindd = ALT, Print,                        screenshot active,  exec, $scripts/ScreenShot.sh --active
bindd = $mainMod SHIFT, S,                 screenshot swappy,  exec, $scripts/ScreenShot.sh --swappy
bind  = $mainMod, R, exec, pkill -INT wf-recorder || wf-recorder -g "$(slurp)" -f - | ffmpeg -i - -c:v libx264 -preset medium -crf 23 -pix_fmt yuv420p -c:a aac -b:a 128k ~/Videos/$(date +%F_%T).mp4

# ────────────────────────────────────────────
# SES & MEDYA
# ────────────────────────────────────────────
#bindeld = , xf86audioraisevolume, exec, $scripts/Volume.sh --inc
#bindeld = , xf86audiolowervolume, exec, $scripts/Volume.sh --dec
#bindld  = , xf86AudioMicMute,     exec, $scripts/Volume.sh --toggle-mic
#bindld  = , xf86audiomute,        exec, $scripts/Volume.sh --toggle
#bind    = CTRL ALT, mouse_up,     exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 10%+
#bind    = CTRL ALT, mouse_down,   exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 10%-
#bindld  = , xf86AudioPlayPause,   exec, $scripts/MediaCtrl.sh --pause
#bindld  = , xf86AudioPause,       exec, $scripts/MediaCtrl.sh --pause
#bindld  = , xf86AudioPlay,        exec, $scripts/MediaCtrl.sh --pause
#bindld  = , xf86AudioNext,        exec, $scripts/MediaCtrl.sh --nxt
#bindld  = , xf86AudioPrev,        exec, $scripts/MediaCtrl.sh --prv
#bindld  = , xf86audiostop,        exec, $scripts/MediaCtrl.sh --stop

# ────────────────────────────────────────────
# GÖRSEL & TEMA
# ────────────────────────────────────────────
bindd = $mainMod ALT, R,          refresh bar,          exec, $scripts/Refresh.sh
bindd = $mainMod SHIFT, A,        animations menu,      exec, $scripts/Animations.sh
bindd = $mainMod ALT, O,          toggle blur,          exec, $scripts/ChangeBlur.sh
bindd = $mainMod SHIFT, G,        game mode,            exec, $scripts/GameMode.sh
bindd = $mainMod ALT, L,          toggle layout,        exec, $scripts/ChangeLayout.sh
bindd = $mainMod CTRL, B,         waybar styles,        exec, $scripts/WaybarStyles.sh
bindd = $mainMod ALT, B,          waybar layout,        exec, $scripts/WaybarLayout.sh
bindd = $mainMod CTRL ALT, B,     toggle waybar,        exec, pkill -SIGUSR1 waybar
bindd = $mainMod CTRL, R,         rofi theme,           exec, $scripts/RofiThemeSelector.sh
bindd = $mainMod CTRL SHIFT, R,   rofi theme (mod),     exec, pkill rofi || true && $scripts/RofiThemeSelector-modified.sh
bindd = $mainMod, N,              night light,          exec, $scripts/Hyprsunset.sh toggle
bindd = $mainMod SHIFT, W,        wallpaper effects,    exec, $scripts/WallpaperEffects.sh
bindd = CTRL ALT, W,              random wallpaper,     exec, $scripts/WallpaperRandom.sh
bindd = $mainMod ALT, W,          select wallpaper,     exec, $scripts/WallpaperSelect.sh
bindd = $mainMod SHIFT, O,        zsh theme,            exec, $scripts/ZshChangeTheme.sh

# Masaüstü zoom
bindd = $mainMod ALT, mouse_down, zoom in,  exec, hyprctl keyword cursor:zoom_factor "$(hyprctl getoption cursor:zoom_factor | awk 'NR==1 {factor = $2; if (factor < 1) {factor = 1}; print factor * 2.0}')"
bindd = $mainMod ALT, mouse_up,   zoom out, exec, hyprctl keyword cursor:zoom_factor "$(hyprctl getoption cursor:zoom_factor | awk 'NR==1 {factor = $2; if (factor < 1) {factor = 1}; print factor / 2.0}')"

# ────────────────────────────────────────────
# PANO / NOTLAR / ARAÇLAR
# ────────────────────────────────────────────
#bind = $mainMod, V, exec, (echo "󰆴 TÜM GEÇMİŞİ SİL"; cliphist list) | rofi -dmenu -i -p "Pano" -selected-row 1 | if read -r selected; then if [ "$selected" = "󰆴 TÜM GEÇMİŞİ SİL" ]; then cliphist wipe && notify-send "Pano" "Tüm geçmiş temizlendi!"; else echo "$selected" | cliphist decode | wl-copy && sleep 0.1 && wtype -M ctrl v -m ctrl; fi; fi
bind = $mainMod, V, exec, ~/.config/hypr/scripts/RofiCopyHist.sh
bind = $mainMod, E, exec, thunar ~
bind = $mainMod, C,           exec, $scripts/RofiCalc.sh
bind = $mainMod, period,  exec, $scripts/RofiEmoji.sh
bind = $mainMod SHIFT, M,     exec, $scripts/RofiBeats.sh
bind = $mainMod, O,           exec, ~/dotfiles/scripts/scripts/ocr.sh
bind = $mainMod, Insert,      exec, rofi -dmenu -p "📝 Not Al" | xargs -I{} sh -c 'if [ -n "{}" ]; then echo -e "$(date "+%d.%m.%Y %H:%M") -> {}\n$(cat ~/notlar.txt 2>/dev/null)" > ~/notlar.txt && notify-send "Not Kaydedildi" "{}"; fi'
bind = $mainMod SHIFT, Insert, exec, rofi -dmenu -p "📚 Notların" < ~/notlar.txt
bind = , Insert,              exec, mousepad ~/notlar.txt

# ────────────────────────────────────────────
# KLAVYE DÜZENİ & ÖZEL TUŞLAR
# ────────────────────────────────────────────
#bindlnd = ALT_L, SHIFT_L,    exec, $scripts/SwitchKeyboardLayout.sh
#bindlnd = SHIFT_L, ALT_L,    exec, $scripts/Tak0-Per-Window-Switch.sh
#bindld  = , xf86Sleep,        exec, systemctl suspend
#bindld  = , xf86Rfkill,       exec, $scripts/AirplaneMode.sh
bind    = $mainMod SHIFT, Return, exec, $scripts/Dropterminal.sh $term
bind    = , code:96,          exec, $scripts/Dropterminal.sh $term
bind    = , code:78,          exec, kitty -e btop
#bind    = , code:127,         workspace, 3
# Keybinds.conf içine ekle
bind = , code:127, focuswindow, title:.*WhatsApp.*
bind = $mainMod, H, exec, $scripts/KeyBinds.sh
bind = $mainMod, M, exec, ~/.config/hypr/scripts/RofiBeats.sh

#
# Laptop tuşları
#

# --- Ses Kontrolü ---
# Sesi Artır
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
# Sesi Azalt
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
# Sesi Kapa/Aç (Mute)
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
# Mikrofonu Kapa/Aç
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# --- Parlaklık Kontrolü ---
# Parlaklık Artır
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
# Parlaklık Azalt
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
# Alt + Tab ile pencereler arası geçiş (Sadece mevcut masaüstü)
bind = ALT, Tab, cyclenext,          # Sonraki pencereye odaklan
bind = ALT, Tab, bringactivetotop,   # Odaklanan pencereyi öne getir


input {
    kb_layout = tr
    numlock_by_default = false
    # Diğer klavye ayarlarınız buraya gelecek (hassasiyet vb.)
    follow_mouse = 1
}

bind = , KP_End, workspace, 1     # NumLock açık
bind = , KP_Down, workspace, 2
bind = , KP_Next, workspace, 3
bind = , KP_Left, workspace, 4
bind = , KP_Begin, workspace, 5
bind = , KP_Right, workspace, 6
bind = , KP_Home, workspace, 7
bind = , KP_Up, workspace, 8
bind = , KP_Prior, workspace, 9
# Sadece NumLock KAPALIYKEN çalışması için (Mod2 maskesi olmadan)
# Ctrl + Enter ile Ghostty terminalini açar
bind = CTRL, Return, exec, ghostty
# Sistem genelinde Play/Pause (Hangi player açıksa ona hükmeder)
bindl = , XF86AudioPlay, exec, playerctl play-pause
bind = $mainMod ALT, V, exec, ~/.config/hypr/scripts/dict.sh

bind = MOD5, F1, exec, thunar ~/Downloads

# Alt Gr + F2 -> Documents (Belgeler)
bind = MOD5, F2, exec, thunar ~/Documents

# Alt Gr + F3 -> Personel Evrakları (Özel Yol)
bind = MOD5, F3, exec, thunar "/home/thinkpad/Documents/Personel Evrakları/"
